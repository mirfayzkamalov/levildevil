    height: 8px;

    border-radius: 4px;
    vertical-align: middle;
    margin-left: 4px;
    position: relative;
    overflow: hidden;

    background: linear-gradient(90deg, #66ff66, #ffff00, #ff2222);
    width: 0%;
    transition: width 0.4s;
  }

    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, #1a0520 0%, #0a0208 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow: hidden;
  }
  #loading.hide { display: none; }

    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,60,60,0.5), transparent),
      radial-gradient(2px 2px at 60% 70%, rgba(255,100,100,0.4), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,200,200,0.6), transparent),
      radial-gradient(2px 2px at 40% 90%, rgba(200,60,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 90% 80%, rgba(255,80,80,0.5), transparent);
    background-size: 200% 200%;
    animation: bgShift 8s ease-in-out infinite alternate;
    opacity: 0.7;
  }
  @keyframes bgShift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  .loading-content {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 70%;
    max-width: 520px;
  }

  .loading-title {
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #ff2222;
    text-shadow:
      0 0 10px #ff0000,
      0 0 30px #ff0000,
      0 0 60px #ff0000,
      0 0 100px #ff0000;
    margin-bottom: 8px;
    animation: titlePulse 2s ease-in-out infinite;

    0%, 100% {
      transform: scale(1);

  .loading-subtitle {
    font-size: 16px;
    color: #ff8888;
    letter-spacing: 6px;
    margin-bottom: 40px;
    text-shadow: 0 0 10px #ff0000;

  }
  @keyframes subtitleBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }

  .loading-bar-wrap {
    width: 100%;
    height: 24px;
    background: #1a0a10;
    border: 2px solid #661111;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow:

  .loading-bar {

    "Tuzoqlar yuklanmoqda...",
    "500 ta level tayyorlanmoqda...",
    "Devil belgisi chizilmoqda...",
    "Spikelar o'tkirlashtirilmoqda...",

    "Yolg'on eshiklar o'rnatilmoqda...",
    "Shiftlar mustahkamlanmoqda...",
    "Devorlar harakatga keltirilmoqda...",
    "Zarrachalar tizimi ishga tushirilmoqda...",
    "Kamera sozlanmoqda...",
    "Ovoz effektlari ulanmoqda...",
    "Xotira tozalanmoqda...",
    "Sahnalar yuklanmoqda...",
    "Yakuniy tekshiruv...",
    "Tayyor! Boshlashga 3..."
  ];

  let loadingStart = null;
  let loadingDone = false;

  function updateLoading(timestamp) {
    if (!loadingStart) loadingStart = timestamp;
    const elapsed = timestamp - loadingStart;
    const progress = Math.min(1, elapsed / LOADING_DURATION);

    // Foizni ko'rsatish
    const percent = Math.floor(progress * 100);
    loadingBar.style.width = percent + '%';
    loadingPercent.textContent = percent + '%';

    // Status xabarlarini ketma-ket ko'rsatish
    const msgIdx = Math.min(
      statusMessages.length - 1,
      Math.floor(progress * statusMessages.length)
    );
    if (loadingStatus.textContent !== statusMessages[msgIdx]) {
      loadingStatus.textContent = statusMessages[msgIdx];
    }

    if (progress >= 1 && !loadingDone) {
      loadingDone = true;
      loadingStatus.textContent = "TAYYOR!";
      setTimeout(() => {
        loadingScreen.classList.add('hide');
        showOverlay('menu');
      }, 400);
    }

    if (!loadingDone) {
      requestAnimationFrame(updateLoading);
    }
  }

  // Loading boshlash
  requestAnimationFrame(updateLoading);

  // ==================== SOZLAMALAR ====================
  const canvas = document.getElementById('game');

      { type: 'fakeExit', x: 11, y: 14 },
      { type: 'ceilingSpike', x: 18, w: 3, triggerX: 16 },
      { type: 'ceilingSpike', x: 26, w: 3, triggerX: 24 },
      { type: 'movingWall', x: 30, w: 1, h: 15, speed: 0.075 },
      { type: 'ceilingCrush', triggers: [37, 41] }
    ]
  });

  // ==================== LEVEL GENERATOR ====================
  function generateLevel(num) {
    const rng = mulberry32(num * 987654321 + 42);
    const diffLevel = Math.min(50, Math.floor((num - 1) / 10) + 1);

    const width = Math.min(80, 34 + Math.floor(diffLevel * 0.9));
    const height = 18;

    const diffNames = [
      'OSON', 'OSON+', "O'RTACHA-", "O'RTACHA", "O'RTACHA+",
      'QIYIN-', 'QIYIN', 'QIYIN+', 'JUDA QIYIN', 'DEVIL 😈'
    ];
    const diffIdx = Math.min(9, Math.floor((diffLevel - 1) / 5));
    const difficulty = diffNames[diffIdx];

    const grid = [];
    for (let y = 0; y < height; y++) {
      const row = [];
      for (let x = 0; x < width; x++) {
        if (y === 0 || y === height - 1 || y === height - 2) row.push('#');
        else if (x === 0 || x === width - 1) row.push('#');
        else row.push('.');
      }
      grid.push(row);
    }

    const startX = 2;
    const startY = height - 3;
    const exitX = width - 4;
    const exitY = height - 3;

    grid[startY][startX] = 'P';
    grid[exitY][exitX] = 'E';

    const events = [];
    const usedX = new Set([startX, exitX]);

    if (diffLevel >= 2) {
      const spikeCount = Math.min(4, Math.floor(diffLevel / 8) + 1);
      for (let i = 0; i < spikeCount; i++) {
        let sx;
        let tries = 0;
        do {
          sx = 6 + Math.floor(rng() * (width - 14));
          tries++;
        } while ((usedX.has(sx) || usedX.has(sx-1) || usedX.has(sx+1)) && tries < 30);
        if (tries >= 30) continue;
        usedX.add(sx);
        const triggerX = Math.max(startX + 2, sx - 2 - Math.floor(rng() * 2));
        events.push({
          type: 'ceilingSpike',
          x: sx, w: 2 + Math.floor(rng() * 2),
          triggerX
        });
      }

      if (diffLevel >= 3 && rng() < 0.55) {
        let fx;
        let tries = 0;
        do {
          fx = 6 + Math.floor(rng() * (width - 14));
          tries++;
        } while ((usedX.has(fx) || usedX.has(fx-1) || usedX.has(fx+1) || Math.abs(fx - exitX) < 4) && tries < 30);
        if (tries < 30) {
          usedX.add(fx);
          events.push({ type: 'fakeExit', x: fx, y: height - 3 });
        }
      }

      if (diffLevel >= 5) {
        const crushCount = Math.min(3, Math.floor(diffLevel / 12) + 1);
        const triggers = [];
        for (let i = 0; i < crushCount; i++) {
          let tx;
          let tries = 0;
          do {
            tx = 8 + Math.floor(rng() * (width - 16));
            tries++;
          } while (usedX.has(tx) && tries < 20);
          usedX.add(tx);
          triggers.push(tx);
        }
        if (triggers.length) {
          events.push({ type: 'ceilingCrush', triggers });
        }
      }

      if (diffLevel >= 4) {
        const wallX = 14 + Math.floor(rng() * (width - 22));
        const speed = 0.045 + rng() * 0.04 + diffLevel * 0.0008;
        usedX.add(wallX);
        events.push({
          type: 'movingWall',
          x: wallX, w: 1, h: height - 3,
          speed
        });
      }

      if (diffLevel >= 7) {
        const extra = Math.min(3, Math.floor(diffLevel / 15));
        for (let i = 0; i < extra; i++) {
          let sx;
          let tries = 0;
          do {
            sx = 6 + Math.floor(rng() * (width - 14));
            tries++;
          } while ((usedX.has(sx) || usedX.has(sx-1) || usedX.has(sx+1)) && tries < 20);
          if (tries >= 20) continue;
          usedX.add(sx);
          events.push({
            type: 'ceilingSpike',
            x: sx, w: 2 + Math.floor(rng() * 2),
            triggerX: Math.max(startX + 2, sx - 2)
          });
        }
      }
    }

    const map = grid.map(row => row.join(''));
    return { difficulty, width, height, map, events };
  }

  function getLevel(idx) {
    if (idx < handLevels.length) return handLevels[idx];
    return generateLevel(idx + 1);
  }

  // ==================== LEVEL PARSER ====================
  let currentLevel = null;

  function parseLevel(idx) {
    const def = getLevel(idx);
    const grid = def.map.map(r => r.split(''));
    let startPos = { x: 2, y: 2 };
    let exitPos = { x: 10, y: 10 };

    for (let y = 0; y < grid.length; y++) {
      for (let x = 0; x < grid[y].length; x++) {
        const c = grid[y][x];
        if (c === 'P') { startPos = { x, y }; grid[y][x] = '.'; }
        else if (c === 'E') { exitPos = { x, y }; grid[y][x] = '.'; }
        else if (c === 'H') { grid[y][x] = '.'; }
      }
    }

    const events = [];
    (def.events || []).forEach(ev => {
      const e = JSON.parse(JSON.stringify(ev));
      e.active = false;
      e.triggered = false;
      e.progress = 0;
      if (e.type === 'ceilingSpike') {
        e.y = 1;
        e.h = e.h || 13;
        e.falling = false;
        e.spikeY = e.y * TILE;
        e.triggered = false;
      }
      if (e.type === 'fakeExit') {
        e.visible = true;
        e.x = e.x * TILE;
        e.y = e.y * TILE;
        e.activated = false;
        e.spikeY = -200;
        e.spikeVy = 0;
      }
      if (e.type === 'ceilingCrush') {
        e.triggeredSet = [];
        e.y = 0;
        e.w = W;
        e.h = 0;
        e.targetH = 13 * TILE;
        e.crushing = false;
      }
      if (e.type === 'movingWall') {
        e.x = e.x * TILE;
        e.y = (e.y || 1) * TILE;
        e.w = e.w * TILE;
        e.h = e.h * TILE;
        e.dir = 1;
        e.startX = e.x;
        e.range = 8 * TILE;
      }
      events.push(e);
    });

    return {
      grid,
      width: def.width,
      height: def.height,
      startPos,
      exitPos,
      events,
      definition: def
    };
  }

  function loadLevel(idx) {
    currentLevel = parseLevel(idx);
    game.level = idx + 1;
    game.state = 'playing';
    game.particles = [];
    game.shake = 0;
    player.x = currentLevel.startPos.x * TILE + (TILE - player.w) / 2;
    player.y = currentLevel.startPos.y * TILE + (TILE - player.h);
    player.vx = 0; player.vy = 0;
    player.onGround = false;
    player.alive = true;
    player.facing = 1;
    player.coyote = 0;
    player.jumpBuffer = 0;
    lvlDisplay.textContent = game.level;
    deathDisplay.textContent = game.deaths;
    diffDisplay.textContent = currentLevel.definition.difficulty;
    progBar.style.width = ((game.level / game.maxLevel) * 100).toFixed(1) + '%';
    overlay.classList.remove('show');
  }

  function restartLevel() {
    if (game.state === 'menu' || game.state === 'final') return;
    loadLevel(game.level - 1);
  }

  function nextLevel() {
    if (game.level < game.maxLevel) {
      loadLevel(game.level);
    } else {
      showFinalWin();
    }
  }

  function startGame() {
    game.level = 1;
    game.deaths = 0;
    loadLevel(0);
  }

  // ==================== TO'SIQ ====================
  function isSolid(tx, ty) {
    if (ty < 0 || ty >= currentLevel.grid.length) return false;
    if (tx < 0 || tx >= currentLevel.grid[0].length) return true;
    return currentLevel.grid[ty][tx] === '#';
  }

  function rectCollides(x, y, w, h) {
    const x1 = Math.floor(x / TILE);
    const x2 = Math.floor((x + w - 1) / TILE);
    const y1 = Math.floor(y / TILE);
    const y2 = Math.floor((y + h - 1) / TILE);
    for (let ty = y1; ty <= y2; ty++) {
      for (let tx = x1; tx <= x2; tx++) {
        if (isSolid(tx, ty)) return true;
      }
    }
    return false;
  }

  // ==================== HARAKAT ====================
  function updatePlayer() {
    if (!player.alive) return;

    let move = 0;
    if (keys.left) move -= 1;
    if (keys.right) move += 1;

    if (move !== 0) {
      player.vx += move * MOVE_ACCEL;
      player.facing = move;
      if (Math.abs(player.vx) > MOVE_MAX) player.vx = MOVE_MAX * Math.sign(player.vx);
    } else {
      player.vx *= FRICTION;
      if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }

    if (player.onGround) player.coyote = 8;
    else if (player.coyote > 0) player.coyote--;

    if (keys.jump) {
      if (player.jumpBuffer === 0) player.jumpBuffer = 8;
    }
    if (player.jumpBuffer > 0) player.jumpBuffer--;

    if (player.jumpBuffer > 0 && player.coyote > 0) {
      player.vy = JUMP_POWER;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
      spawnParticles(player.x + player.w/2, player.y + player.h, 6, '#66ff66');
    }

    if (!keys.jump && player.vy < -5) player.vy *= 0.85;

    player.vy += GRAVITY;
    if (player.vy > 18) player.vy = 18;

    let nx = player.x + player.vx;
    if (!rectCollides(nx, player.y, player.w, player.h)) {
      player.x = nx;
    } else {
      let stepped = false;
      for (let step = 1; step <= 6; step++) {
        if (!rectCollides(nx, player.y - step, player.w, player.h)) {
          player.y -= step;
          player.x = nx;
          stepped = true;
          break;
        }
      }
      if (!stepped) player.vx = 0;
    }

    let ny = player.y + player.vy;
    if (!rectCollides(player.x, ny, player.w, player.h)) {
      player.y = ny;
      player.onGround = false;
    } else {
      if (player.vy > 0) {
        player.y = Math.floor((player.y + player.h) / TILE) * TILE - player.h;
        if (player.vy > 8) {
          spawnParticles(player.x + player.w/2, player.y + player.h, 5, '#888');
        }
        player.onGround = true;
      } else {
        player.y = Math.floor(player.y / TILE) * TILE + TILE;
      }
      player.vy = 0;
    }

    if (Math.abs(player.vx) > 0.5 && player.onGround) player.animFrame += 0.3;

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > currentLevel.width * TILE) {
      player.x = currentLevel.width * TILE - player.w;
    }
    if (player.y > H + 100) {
      killPlayer();
    }
  }

  function killPlayer() {
    if (!player.alive) return;
    player.alive = false;
    game.deaths++;
    deathDisplay.textContent = game.deaths;
    game.shake = 20;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, 25, '#ff2222');
    showToast("☠ O'LDINGIZ!");
    setTimeout(() => {
      if (game.state !== 'menu') {
        loadLevel(game.level - 1);
      }
    }, 700);
  }

  function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      game.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 2,
        life: 30 + Math.random() * 30,
        maxLife: 60,
        color,
        size: 2 + Math.random() * 4
      });
    }
  }

  function updateParticles() {
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.vx *= 0.98;
      p.life--;
      if (p.life <= 0) game.particles.splice(i, 1);
    }
  }

  function updateEvents() {
    if (!currentLevel) return;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;

    currentLevel.events.forEach(ev => {
      if (ev.type === 'ceilingSpike') {
        if (!ev.triggered && px > ev.triggerX * TILE) {
          ev.triggered = true;
          ev.falling = true;
          game.shake = 8;
          if (game.level <= 15) showToast("⚠ SHIFTGA QARA!");
        }
        if (ev.falling) {
          ev.progress += 1.4;
          ev.spikeY += ev.progress;
          const spikeH = ev.h * TILE;
          const spikeX = ev.x * TILE;
          const spikeW = ev.w * TILE;
          if (player.alive &&
              px > spikeX && px < spikeX + spikeW &&
              player.y + player.h > ev.spikeY && player.y < ev.spikeY + spikeH) {
            killPlayer();
          }
        }
      }

      if (ev.type === 'fakeExit') {
        if (ev.visible && player.alive &&
            player.x + player.w > ev.x && player.x < ev.x + TILE * 1.2 &&
            player.y + player.h > ev.y && player.y < ev.y + TILE * 1.2) {
          ev.visible = false;
          ev.activated = true;
          ev.spikeVy = 0;
          ev.spikeY = -100;
          game.shake = 15;
          if (game.level <= 15) showToast("😈 YOLG'ON ESHIK!");
        }
        if (ev.activated) {
          ev.spikeVy += 0.8;
          ev.spikeY += ev.spikeVy;
          if (player.alive &&
              player.x + player.w > ev.x && player.x < ev.x + TILE * 1.5 &&
              player.y + player.h > ev.spikeY && player.y < ev.spikeY + 60) {
            killPlayer();
          }
        }
      }

      if (ev.type === 'ceilingCrush') {
        ev.triggeredSet = ev.triggeredSet || [];
        ev.triggers.forEach(tx => {
          if (!ev.triggeredSet.includes(tx) && px > tx * TILE) {
            ev.triggeredSet.push(tx);
            ev.crushing = true;
          }
        });
        if (ev.crushing) {
          if (ev.h < ev.targetH) {
            ev.h += 3;
            if (ev.h >= ev.targetH) ev.h = ev.targetH;
            if (player.alive && player.y < ev.h) {
              killPlayer();
            }
          }
        }
      }

      if (ev.type === 'movingWall') {
        ev.x += ev.speed * ev.dir * TILE / 3;
        if (ev.x > ev.startX + ev.range) ev.dir = -1;
        if (ev.x < ev.startX) ev.dir = 1;
        if (player.alive &&
            player.x + player.w > ev.x && player.x < ev.x + ev.w &&
            player.y + player.h > ev.y && player.y < ev.y + ev.h) {
          killPlayer();
        }
      }
    });
  }

  function checkExit() {
    if (!currentLevel || !player.alive) return;
    const ex = currentLevel.exitPos.x * TILE;
    const ey = currentLevel.exitPos.y * TILE;
    if (player.x + player.w > ex && player.x < ex + TILE &&
        player.y + player.h > ey && player.y < ey + TILE) {
      game.state = 'win';
      spawnParticles(ex + TILE/2, ey + TILE/2, 30, '#66ff66');
      if (game.level < game.maxLevel) {
        if (game.level % 25 === 0) {
          setTimeout(() => {
            if (game.state === 'win') nextLevel();
          }, 500);
          overlay.classList.add('show');
          overlay.innerHTML = `
            <h2>✔ LEVEL ${game.level} / 500</h2>
            <p style="color:#66ff66">${currentLevel.definition.difficulty}</p>
            <p style="color:#ff6666;font-style:italic;margin-top:10px">
              Keyingi level yaqinlashmoqda...
            </p>
          `;
        } else {
          showOverlay('win');
        }
      } else {
        showFinalWin();
      }
    }
  }

  function updateCamera() {
    if (!currentLevel) return;
    const targetX = player.x + player.w / 2 - W / 2;
    const levelW = currentLevel.width * TILE;
    let cx = targetX;
    if (cx < 0) cx = 0;
    if (cx > levelW - W) cx = levelW - W;
    if (levelW < W) cx = (levelW - W) / 2;
    game.camera.x += (cx - game.camera.x) * 0.12;
    game.camera.y = 0;
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 900);
  }

  function showOverlay(type) {
    overlay.classList.add('show');
    if (type === 'menu') {
      overlay.innerHTML = `
        <h1>DEVIL TRAP</h1>
        <h2>500 LEVEL</h2>
        <p>Bu oddiy platformer emas. Har bir qadam — tuzoq.</p>
        <p>Maqsad: <span style="color:#66ff66">EXIT</span> eshigiga yetib borish.</p>
        <p style="color:#ff88ff; margin-top:10px">
          <b>500 ta level</b> — OSONdan DEVILgacha qiyinlashib boradi
        </p>
        <p style="margin-top:14px">
          <span class="key">A</span> <span class="key">D</span> yoki
          <span class="key">←</span> <span class="key">→</span> — yurish &nbsp;|&nbsp;
          <span class="key">SPACE</span> — sakrash
        </p>
        <p><span class="key">R</span> — qayta boshlash &nbsp;|&nbsp;
           <span class="key">ESC</span> — pauza</p>
        <button class="btn" id="btnStart">▶ BOSHLASH</button>
      `;
      document.getElementById('btnStart').onclick = () => startGame();
    } else if (type === 'win') {
      const nextDef = getLevel(game.level);
      overlay.innerHTML = `
        <h2>✔ LEVEL ${game.level} / 500</h2>
        <p>Siz: <span style="color:#66ff66">${currentLevel.definition.difficulty}</span></p>
        <p>Keyingi: <span style="color:#ff88ff">${nextDef.difficulty}</span></p>
        <button class="btn" id="btnNext">▶ KEYINGI LEVEL</button>
      `;
      document.getElementById('btnNext').onclick = () => nextLevel();
    } else if (type === 'paused') {
      overlay.innerHTML = `
        <h2>⏸ PAUZA</h2>
        <p>Level ${game.level} / 500 — ${currentLevel.definition.difficulty}</p>
        <p>O'limlar: ${game.deaths}</p>
        <button class="btn" id="btnResume">▶ DAVOM ETISH</button>
        <button class="btn secondary" id="btnRestart">↻ QAYTA BOSHLASH</button>
      `;
      document.getElementById('btnResume').onclick = () => togglePause();
      document.getElementById('btnRestart').onclick = () => {
        overlay.classList.remove('show');
        game.state = 'playing';
        loadLevel(game.level - 1);
      };
    } else if (type === 'final') {
      overlay.innerHTML = `
        <h1>🏆 G'ALABA!</h1>
        <h2>Siz 500 LEVELNI yutdingiz!</h2>
        <p>O'limlar soni: <span style="color:#ffaa00">${game.deaths}</span></p>
        <p style="color:#ff6666; margin-top:10px">Siz haqiqiy DEVIL qahramonsiz! 😈</p>
        <button class="btn" id="btnAgain">↻ YANA O'YNASH</button>
      `;
      document.getElementById('btnAgain').onclick = () => {
        game.state = 'menu';
        showOverlay('menu');
      };
    }
  }

  function showFinalWin() {
    game.state = 'final';
    showOverlay('final');
  }

  function togglePause() {
    if (game.state === 'playing') {
      game.state = 'paused';
      showOverlay('paused');
    } else if (game.state === 'paused') {
      game.state = 'playing';
      overlay.classList.remove('show');
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1025');
    g.addColorStop(0.5, '#12121a');
    g.addColorStop(1, '#0a0a12');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255, 80, 80, 0.15)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137 + game.time * 0.3) % W;
      const sy = (i * 89) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }

    ctx.strokeStyle = 'rgba(255, 40, 40, 0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawLevel() {
    if (!currentLevel) return;
    const camX = game.camera.x;
    const camY = game.camera.y;

    const gx1 = Math.max(0, Math.floor(camX / TILE) - 1);
    const gx2 = Math.min(currentLevel.width - 1, Math.floor((camX + W) / TILE) + 1);

    for (let y = 0; y < currentLevel.grid.length; y++) {
      for (let x = gx1; x <= gx2; x++) {
        const c = currentLevel.grid[y][x];
        const px = x * TILE - camX;
        const py = y * TILE - camY;

        if (c === '#') {
          const wg = ctx.createLinearGradient(px, py, px, py + TILE);
          wg.addColorStop(0, '#3a3a4a');
          wg.addColorStop(1, '#1e1e2a');
          ctx.fillStyle = wg;
          ctx.fillRect(px, py, TILE, TILE);

          ctx.fillStyle = 'rgba(120, 120, 180, 0.35)';
          ctx.fillRect(px, py, TILE, 3);

          ctx.strokeStyle = 'rgba(0,0,0,0.4)';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);

          ctx.fillStyle = 'rgba(255,255,255,0.04)';
          ctx.fillRect(px + 6, py + 8, 4, 4);
          ctx.fillRect(px + 18, py + 18, 4, 4);
        }
      }
    }

    const ex = currentLevel.exitPos.x * TILE - camX;
    const ey = currentLevel.exitPos.y * TILE - camY;
    drawExit(ex, ey);

    currentLevel.events.forEach(ev => {
      if (ev.type === 'fakeExit' && ev.visible) {
        drawFakeExit(ev.x - camX, ev.y - camY);
      }
    });
  }

  function drawExit(x, y) {
    const pulse = Math.sin(game.time * 0.08) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#00ff00';
    ctx.shadowBlur = 15 + pulse * 15;

    const g = ctx.createLinearGradient(x, y, x, y + TILE);
    g.addColorStop(0, '#00ff44');
    g.addColorStop(1, '#008822');
    ctx.fillStyle = g;
    ctx.fillRect(x + 4, y, TILE - 8, TILE);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 8, y + 6, TILE - 16, TILE - 6);

    ctx.fillStyle = `rgba(0, 255, 100, ${0.5 + pulse * 0.5})`;
    ctx.fillRect(x + 6, y + 4, TILE - 12, TILE - 8);
    ctx.restore();
  }

  function drawFakeExit(x, y) {
    const pulse = Math.sin(game.time * 0.08) * 0.5 + 0.5;
    ctx.save();
    ctx.shadowColor = '#ff2200';
    ctx.shadowBlur = 10 + pulse * 10;

    const g = ctx.createLinearGradient(x, y, x, y + TILE);
    g.addColorStop(0, '#00ff44');
    g.addColorStop(1, '#008822');
    ctx.fillStyle = g;
    ctx.fillRect(x + 4, y, TILE - 8, TILE);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 8, y + 6, TILE - 16, TILE - 6);
    ctx.fillStyle = `rgba(0, 255, 100, ${0.5 + pulse * 0.5})`;
    ctx.fillRect(x + 6, y + 4, TILE - 12, TILE - 8);
    ctx.restore();
  }

  function drawEvents() {
    if (!currentLevel) return;
    const camX = game.camera.x;
    const camY = game.camera.y;

    currentLevel.events.forEach(ev => {
      if (ev.type === 'ceilingSpike' && ev.falling) {
        const sx = ev.x * TILE - camX;
        const sy = ev.spikeY - camY;
        drawSpikes(sx, sy, ev.w * TILE, ev.h * TILE, 'down');
      }

      if (ev.type === 'fakeExit' && ev.activated) {
        const sx = ev.x - camX;
        const sy = ev.spikeY - camY;
        drawSpikes(sx, sy, TILE * 1.5, 60, 'down');
      }

      if (ev.type === 'ceilingCrush' && ev.h > 0) {
        ctx.save();
        const g = ctx.createLinearGradient(0, 0, 0, ev.h);
        g.addColorStop(0, '#1e1e2a');
        g.addColorStop(0.7, '#3a3a4a');
        g.addColorStop(1, '#5a1a1a');
        ctx.fillStyle = g;
        ctx.fillRect(0, -camY, W, ev.h);
        drawSpikes(0, ev.h - 20 - camY, W, 20, 'down');
        ctx.restore();
      }

      if (ev.type === 'movingWall') {
        const px = ev.x - camX;
        const py = ev.y - camY;
        ctx.save();
        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 12;
        const g = ctx.createLinearGradient(px, py, px + ev.w, py);
        g.addColorStop(0, '#5a1a1a');
        g.addColorStop(0.5, '#aa2a2a');
        g.addColorStop(1, '#5a1a1a');
        ctx.fillStyle = g;
        ctx.fillRect(px, py, ev.w, ev.h);
        ctx.restore();
      }
    });
  }

  function drawSpikes(x, y, w, h, dir) {
    ctx.save();
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10;
    const count = Math.max(1, Math.floor(w / 15));
    const sw = w / count;
    ctx.fillStyle = '#cc2222';
    ctx.beginPath();
    if (dir === 'down') {
      for (let i = 0; i < count; i++) {
        const bx = x + i * sw;
        ctx.moveTo(bx, y);
        ctx.lineTo(bx + sw / 2, y + h);
        ctx.lineTo(bx + sw, y);
      }
    } else {
      for (let i = 0; i < count; i++) {
        const bx = x + i * sw;
        ctx.moveTo(bx, y + h);
        ctx.lineTo(bx + sw / 2, y);
        ctx.lineTo(bx + sw, y + h);
      }
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,100,100,0.5)';
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    if (!player.alive) return;
    const camX = game.camera.x;
    const camY = game.camera.y;
    const px = player.x - camX;
    const py = player.y - camY;

    ctx.save();

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(px + player.w/2, py + player.h + 4, player.w * 0.7, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    const bob = player.onGround && Math.abs(player.vx) > 0.5
      ? Math.sin(player.animFrame) * 1.5 : 0;

    ctx.fillStyle = '#8a1a1a';
    ctx.fillRect(px + 2, py + player.h - 8 + bob, 6, 8 - bob);
    ctx.fillRect(px + player.w - 8, py + player.h - 8 - bob, 6, 8 + bob);

    const bg = ctx.createLinearGradient(px, py, px, py + player.h);
    bg.addColorStop(0, '#ff4444');
    bg.addColorStop(1, '#aa1111');
    ctx.fillStyle = bg;
    ctx.fillRect(px, py + bob, player.w, player.h - 8);

    ctx.fillStyle = '#ff6666';
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + 6 + bob, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    const eyeOff = player.facing > 0 ? 2 : -3;
    ctx.fillRect(px + player.w/2 - 2 + eyeOff, py + 4 + bob, 2, 2);
    ctx.fillRect(px + player.w/2 + 1 + eyeOff, py + 4 + bob, 2, 2);

    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.moveTo(px + 3, py + bob);
    ctx.lineTo(px + 1, py - 4 + bob);
    ctx.lineTo(px + 6, py + 1 + bob);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px + player.w - 3, py + bob);
    ctx.lineTo(px + player.w - 1, py - 4 + bob);
    ctx.lineTo(px + player.w - 6, py + 1 + bob);
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(255, 60, 60, 0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, py + bob, player.w, player.h - 8);

    ctx.restore();
  }

  function drawParticles() {
    const camX = game.camera.x;
    const camY = game.camera.y;
    game.particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(p.x - camX - p.size/2, p.y - camY - p.size/2, p.size, p.size);
      ctx.restore();
    });
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  let lastTime = 0;
  let accumulator = 0;
  const STEP = 1000 / 60;

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = t - lastTime;
    lastTime = t;
    if (dt > 100) { accumulator = 0; return; }
    accumulator += dt;
    while (accumulator >= STEP) {
      update();
      accumulator -= STEP;
    }
    render();
  }

  function update() {
    game.time++;

    if (game.state === 'playing' || game.state === 'win') {
      if (game.state === 'playing') {
        updatePlayer();
        updateEvents();
        checkExit();
      }
      updateParticles();
      updateCamera();
    }

    if (game.shake > 0) game.shake *= 0.85;
    if (game.shake < 0.5) game.shake = 0;
  }

  function render() {
    ctx.save();

    if (game.shake > 0) {
      ctx.translate(
        (Math.random() - 0.5) * game.shake,
        (Math.random() - 0.5) * game.shake
      );
    }

    drawBackground();
    if (currentLevel && game.state !== 'menu') {
      drawLevel();
      drawEvents();
      drawParticles();
      drawPlayer();
    }
    drawVignette();

    ctx.restore();
  }

  requestAnimationFrame(loop);

})();
</script>
</body>
